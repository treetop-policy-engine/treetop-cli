[package]
name = "treetop-cli"
version = "0.2.0"
edition = "2024"
description = "Command-line client and interactive REPL for Treetop authorization servers"
license = "MIT"
repository = "https://github.com/treetop-policy-engine/treetop-cli"
publish = false
rust-version = "1.93.1"
build = "build.rs"
autobenches = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
colored = "3.1.1"
dirs = "7.0.0"
rustyline = "18.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tabled = "0.22.0"
tokio = { version = "1.53.1", features = ["fs", "macros", "rt-multi-thread", "sync", "time"] }
toml = "1.1.6"
treetop-client = "=0.2.0"
uuid = { version = "1.27.0", features = ["v4"] }

[dev-dependencies]
assert_cmd = "2.2.2"
gungraun = "0.20.0"
predicates = "3.1.4"
rstest = "0.27.0"
tempfile = "3.27.0"
wiremock = "0.6.5"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
panic = "abort"
strip = "symbols"

[profile.bench]
# Callgrind needs function symbols to locate the measured benchmark entry points.
strip = "none"

[[bench]]
name = "cli_matrix_simple_callgrind"
harness = false

[[bench]]
name = "cli_matrix_bracketed_callgrind"
harness = false

[[bench]]
name = "cli_matrix_with_attrs_callgrind"
harness = false
